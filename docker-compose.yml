name: knowops
services:
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: knowops
      MYSQL_USER: knowops
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:13306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.2
    ports: ["127.0.0.1:16379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd", "--heartbeat-interval=250", "--election-timeout=2500"]
    volumes: ["etcd_data:/etcd"]
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: ["minio", "server", "/data"]
    volumes: ["minio_data:/data"]
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.5.27
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
    ports: ["127.0.0.1:19540:19530", "127.0.0.1:19091:9091"]
    volumes: ["milvus_data:/var/lib/milvus"]
    restart: unless-stopped
    depends_on: [etcd, minio]
  attu:
    image: zilliz/attu:v2.5.10
    profiles: [admin]
    environment:
      MILVUS_URL: milvus:19530
    ports: ["127.0.0.1:8000:3000"]
    depends_on: [milvus]
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
